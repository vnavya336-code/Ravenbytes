<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarBridge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body><header>
    <h1>ScholarBridge</h1>
    <p>Discover Scholarships. Unlock Your Future.</p>
</header>

<div class="container">

    <h2>Find Scholarships For You</h2>
    <p>Enter your details to discover scholarship opportunities.</p>

    <form action="/check" method="POST">

        <label>Student Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label>State</label>
        <input type="text" value="Karnataka" readonly>

        <label>Education Level</label>
        <select name="level" required>
            <option value="">Select Education</option>
            <option value="10th">10th Passed</option>
            <option value="12th">12th Passed</option>
            <option value="Engineering">Engineering UG</option>
        </select>

        <label>Category</label>
        <select name="category" required>
            <option value="">Select Category</option>
            <option value="SC">SC</option>
            <option value="ST">ST</option>
            <option value="OBC">OBC</option>
            <option value="General">General</option>
            <option value="Minority">Minority</option>
        </select>

        <label>Annual Family Income (₹)</label>
        <input type="number" name="income" min="0" placeholder="Enter annual income" required>

        <label>Previous Examination Marks (%)</label>
        <input type="number" name="marks" min="0" max="100" step="0.01" placeholder="Enter percentage" required>

        <button type="submit">Find Scholarships</button>

    </form>

</div>

</body>
</html>
